<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Layout Shower — page de test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        background: #fafafa;
      }
      .card {
        margin: 20px 40px;
        padding: 16px 24px;
        border: 4px solid #333;
        background: #fff;
      }
      .row {
        display: flex;
        gap: 12px;
        padding: 10px;
        border: 1px solid #ccc;
      }
      .row > div {
        flex: 1;
        padding: 8px;
        margin: 6px 0;
        border: 2px dashed #888;
        background: #eee;
      }
      .btn {
        display: inline-block;
        padding: 6px 14px;
        margin: 0 8px 0 0;
        border: 2px solid #2a6;
        border-radius: 6px;
      }
      .neg {
        margin-top: -10px;
        padding: 12px;
        background: #fde;
      }
      .flex-col {
        display: flex;
        flex-direction: column-reverse;
        gap: 14px 24px;
        width: 220px;
        height: 200px;
        padding: 10px;
        border: 1px solid #a78bfa;
      }
      .flex-col > div {
        background: #ede9fe;
        padding: 6px;
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
        justify-content: space-between;
        padding: 8px;
        border: 1px solid #a78bfa;
      }
      .wrap > div {
        flex: 1 1 140px;
        background: #ede9fe;
        padding: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: 100px 1fr 2fr;
        grid-template-rows: 40px auto;
        gap: 12px 24px;
        padding: 10px;
        border: 1px solid #ec4899;
      }
      .grid > div {
        background: #fce7f3;
        padding: 6px;
      }
      .tall {
        height: 1200px;
        margin: 30px;
        padding: 30px;
        border: 10px solid #ddd;
      }
    </style>
  </head>
  <body>
    <h1>Page de test</h1>
    <div class="card" id="main">
      <p>Carte avec margin 20/40, padding 16/24 et border 4px.</p>
      <a class="btn" href="#">Bouton</a><a class="btn" href="#">Autre</a>
    </div>
    <div class="row">
      <div>Colonne A</div>
      <div>Colonne B</div>
      <div>Colonne C</div>
    </div>
    <h2>Flex</h2>
    <div class="flex-col">
      <div>1 (column-reverse)</div>
      <div>2</div>
      <div>3</div>
    </div>
    <br />
    <div class="wrap">
      <div>a</div>
      <div>b</div>
      <div>c</div>
      <div>d</div>
      <div>e</div>
    </div>
    <h2>Grid</h2>
    <div class="grid">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
    <div class="neg">Margin négative (-10px)</div>
    <div class="tall">Bloc haut pour tester le scroll</div>
  </body>
</html>
